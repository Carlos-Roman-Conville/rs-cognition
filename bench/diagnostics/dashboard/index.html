<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Function Activation Ledger</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f4f5;
      --surface: #fff;
      --text: #18181b;
      --muted: #52525b;
      --border: #d4d4d8;
      --accent: #2563eb;
      --badge-active: #15803d;
      --badge-eligible: #ca8a04;
      --badge-none: #71717a;
      --heat-low: #e0e7ff;
      --heat-mid: #6366f1;
      --heat-high: #312e81;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --surface: #18181b;
        --text: #fafafa;
        --muted: #a1a1aa;
        --border: #3f3f46;
        --accent: #60a5fa;
        --badge-active: #4ade80;
        --badge-eligible: #facc15;
        --badge-none: #a1a1aa;
        --heat-low: #1e1b4b;
        --heat-mid: #6366f1;
        --heat-high: #c7d2fe;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header, main, footer {
      max-width: 72rem;
      margin: 0 auto;
      padding: 1rem 1.25rem;
    }
    header {
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    h1 { font-size: 1.35rem; margin: 0 0 0.35rem; }
    .illustrative {
      display: none;
      margin: 0.5rem 0 0;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--badge-eligible);
      border-radius: 0.375rem;
      font-size: 0.9rem;
    }
    .illustrative.visible { display: block; }
    .meta { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; font-size: 0.9rem; color: var(--muted); }
    .controls { margin-top: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
    label { font-size: 0.85rem; color: var(--muted); }
    input[type="file"], select, input[type="search"] {
      font: inherit;
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 0.25rem;
      background: var(--surface);
      color: var(--text);
      max-width: 100%;
    }
    section {
      margin: 1.25rem 0;
      padding: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
    }
    section h2 { margin: 0 0 0.75rem; font-size: 1.05rem; }
    .cards { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
    .card {
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      padding: 0.75rem;
    }
    .card h3 { margin: 0 0 0.35rem; font-size: 1rem; }
    .card .role { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem 0.5rem; font-size: 0.82rem; }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.5rem 0; }
    .tabs button {
      font: inherit;
      font-size: 0.8rem;
      padding: 0.25rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }
    .tabs button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    @media (prefers-color-scheme: dark) {
      .tabs button[aria-pressed="true"] { color: #09090b; }
    }
    .bar-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.35rem 0; font-size: 0.8rem; }
    .bar-label { width: 1.75rem; text-align: right; flex-shrink: 0; }
    .bar-track { flex: 1; height: 0.65rem; background: var(--bg); border-radius: 0.25rem; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent); border-radius: 0.25rem; }
    .bar-val { width: 3.5rem; font-variant-numeric: tabular-nums; }
    .filters { display: grid; gap: 0.5rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); margin-bottom: 0.75rem; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    th, td { border: 1px solid var(--border); padding: 0.35rem 0.45rem; text-align: left; vertical-align: top; }
    th { background: var(--bg); position: sticky; top: 0; }
    .badge { display: inline-block; padding: 0.1rem 0.35rem; border-radius: 0.25rem; font-size: 0.72rem; font-weight: 600; }
    .badge-activated { background: color-mix(in srgb, var(--badge-active) 25%, transparent); color: var(--badge-active); }
    .badge-eligible { background: color-mix(in srgb, var(--badge-eligible) 25%, transparent); color: var(--badge-eligible); }
    .badge-none { background: color-mix(in srgb, var(--badge-none) 20%, transparent); color: var(--badge-none); }
    .matrix { display: grid; gap: 2px; font-size: 0.72rem; }
    .matrix .cell {
      padding: 0.35rem;
      text-align: center;
      border-radius: 0.2rem;
      min-width: 3.25rem;
    }
    .matrix .corner, .matrix .col-head, .matrix .row-head {
      background: var(--bg);
      font-weight: 600;
    }
    footer {
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
    }
    .empty { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>Function Activation Ledger</h1>
    <p id="illustrative-banner" class="illustrative" role="note">
      Illustrative numbers, not actual results — load a real <code>ledger-report.json</code> to inspect a run.
    </p>
    <div id="header-meta" class="meta"></div>
    <div class="controls">
      <label>
        Ledger report JSON
        <input id="file-input" type="file" accept=".json,application/json" />
      </label>
      <button id="reload-sample" type="button">Reload sample</button>
    </div>
  </header>
  <main>
    <section aria-labelledby="cards-heading">
      <h2 id="cards-heading">Per-function summary</h2>
      <div id="function-cards" class="cards"></div>
      <div class="tabs" id="card-metric-tabs" role="group" aria-label="Stack comparison metric"></div>
      <div id="function-bars"></div>
    </section>
    <section aria-labelledby="table-heading">
      <h2 id="table-heading">Detailed records</h2>
      <p id="table-hint" class="empty"></p>
      <div class="filters" id="table-filters"></div>
      <div class="table-wrap">
        <table id="detail-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
    <section aria-labelledby="map-heading">
      <h2 id="map-heading">Observed relevance map</h2>
      <div class="tabs" id="map-metric-tabs" role="group" aria-label="Map metric"></div>
      <div id="relevance-map"></div>
    </section>
  </main>
  <footer>
    Diagnostic tooling; F1–F13 frozen; no value here tunes the model.
  </footer>
  <script src="dashboard.js"></script>
</body>
</html>
